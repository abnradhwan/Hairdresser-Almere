kind = "web"
previewPath = "/"
title = "Diyar Kapper"
version = "1.0.0"
id = "artifacts/diyar-kapper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26255

[services.development]
run = "pnpm --filter @workspace/diyar-kapper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diyar-kapper", "run", "build" ]
publicDir = "artifacts/diyar-kapper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26255"
BASE_PATH = "/"
