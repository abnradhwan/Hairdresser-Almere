[build]
  command   = "pnpm --filter @workspace/diyar-kapper run build"
  publish   = "artifacts/diyar-kapper/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# SPA fallback — lets Wouter handle all client-side routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
